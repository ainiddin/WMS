# Render Blueprint: render.com -> New -> Blueprint -> pick this repository.
# Creates the web service (API + site, Docker) and a PostgreSQL database; redeploys on every push to main.
services:
  - type: web
    name: keyfive-wms
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keyfive-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: Admin001@wms.kz
      # Asked in the Render dashboard when the Blueprint is created; never stored in git.
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # true = fill an empty database with the demo shop on the first start
      - key: SEED_DEMO
        value: "true"
      - key: APP_TIMEZONE
        value: Asia/Almaty

databases:
  - name: keyfive-db
    plan: free
    region: frankfurt
    databaseName: keyfive_wms
    user: keyfive
