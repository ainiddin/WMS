<div class="page-header">
  <h2>Stock Movements</h2>
</div>

<div class="filters-row">
  <mat-form-field appearance="outline">
    <mat-label>Search Product</mat-label>
    <input matInput [(ngModel)]="filterSearch" placeholder="Product name or code..." (keyup.enter)="applyFilters()">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Type</mat-label>
    <mat-select [(ngModel)]="filterType" (selectionChange)="applyFilters()">
      <mat-option value="">All</mat-option>
      <mat-option value="IN">IN</mat-option>
      <mat-option value="OUT">OUT</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button (click)="clearFilters()">
    <mat-icon>clear</mat-icon> Clear
  </button>
  <button mat-raised-button color="primary" (click)="applyFilters()">
    <mat-icon>filter_list</mat-icon> Filter
  </button>
</div>

<div *ngIf="loading" class="loading">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2 full-width" *ngIf="!loading">
  <ng-container matColumnDef="code">
    <th mat-header-cell *matHeaderCellDef>Code</th>
    <td mat-cell *matCellDef="let m">{{ m.code }}</td>
  </ng-container>
  <ng-container matColumnDef="product_code">
    <th mat-header-cell *matHeaderCellDef>Product Code</th>
    <td mat-cell *matCellDef="let m">{{ m.product_code }}</td>
  </ng-container>
  <ng-container matColumnDef="product_name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Product</th>
    <td mat-cell *matCellDef="let m">{{ m.product_name }}</td>
  </ng-container>
  <ng-container matColumnDef="movement_type">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let m">
      <span [class]="m.movement_type === 'IN' ? 'badge in' : 'badge out'">{{ m.movement_type }}</span>
    </td>
  </ng-container>
  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Qty</th>
    <td mat-cell *matCellDef="let m">{{ m.quantity }}</td>
  </ng-container>
  <ng-container matColumnDef="employee_name">
    <th mat-header-cell *matHeaderCellDef>Employee</th>
    <td mat-cell *matCellDef="let m">{{ m.employee_name }}</td>
  </ng-container>
  <ng-container matColumnDef="movement_time">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
    <td mat-cell *matCellDef="let m">{{ m.movement_time | date:'medium' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
