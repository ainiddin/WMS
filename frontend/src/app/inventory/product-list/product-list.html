<div class="page-header">
  <h2>Products</h2>
  <button mat-raised-button color="primary" *ngIf="canManage()" (click)="openAddDialog()">
    <mat-icon>add</mat-icon> Add Product
  </button>
</div>

<mat-form-field appearance="outline">
  <mat-label>Search</mat-label>
  <input matInput [(ngModel)]="search" (input)="applyFilter()" placeholder="Name, code, barcode...">
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div *ngIf="loading" class="loading">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2 full-width" *ngIf="!loading">
  <ng-container matColumnDef="code">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
    <td mat-cell *matCellDef="let p">{{ p.code }}</td>
  </ng-container>
  <ng-container matColumnDef="product_name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
    <td mat-cell *matCellDef="let p">{{ p.product_name }}</td>
  </ng-container>
  <ng-container matColumnDef="supplier_name">
    <th mat-header-cell *matHeaderCellDef>Supplier</th>
    <td mat-cell *matCellDef="let p">{{ p.supplier_name }}</td>
  </ng-container>
  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Qty</th>
    <td mat-cell *matCellDef="let p" [class.below-min]="p.below_minimum">
      {{ p.quantity }}
      <mat-icon *ngIf="p.below_minimum" class="warn-icon" matTooltip="Below minimum stock">warning</mat-icon>
    </td>
  </ng-container>
  <ng-container matColumnDef="min_quantity">
    <th mat-header-cell *matHeaderCellDef>Min</th>
    <td mat-cell *matCellDef="let p">{{ p.min_quantity }}</td>
  </ng-container>
  <ng-container matColumnDef="unit_price">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Price (₸)</th>
    <td mat-cell *matCellDef="let p">{{ p.unit_price | currency:'KZT':'symbol':'1.2-2' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let p">
      <button mat-icon-button color="primary" (click)="openEditDialog(p)" *ngIf="canManage()" matTooltip="Edit">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.row-below-min]="row.below_minimum"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>
