<h2>Dashboard</h2>

<div *ngIf="loading" class="loading-spinner">
  <mat-spinner diameter="48"></mat-spinner>
</div>

<ng-container *ngIf="!loading">
  <div class="cards-row">
    <mat-card class="stat-card warn">
      <mat-card-content>
        <mat-icon>warning</mat-icon>
        <div class="stat-value">{{ data?.cards?.below_minimum_count }}</div>
        <div class="stat-label">Products Below Minimum</div>
      </mat-card-content>
    </mat-card>
    <mat-card class="stat-card info">
      <mat-card-content>
        <mat-icon>pending</mat-icon>
        <div class="stat-value">{{ data?.cards?.pending_orders }}</div>
        <div class="stat-label">Pending Orders</div>
      </mat-card-content>
    </mat-card>
    <mat-card class="stat-card success">
      <mat-card-content>
        <mat-icon>local_shipping</mat-icon>
        <div class="stat-value">{{ data?.cards?.shipments_this_month }}</div>
        <div class="stat-label">Shipments This Month</div>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-card class="chart-card">
    <mat-card-header>
      <mat-card-title>Monthly Stock Movements</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <canvas baseChart
        [data]="stockChartData"
        [options]="chartOptions"
        type="bar"
        *ngIf="data">
      </canvas>
    </mat-card-content>
  </mat-card>
</ng-container>
