<div class="page-header">
  <h2>User Management</h2>
  <button mat-raised-button color="primary" (click)="openAddDialog()">
    <mat-icon>person_add</mat-icon> Add User
  </button>
</div>

<mat-form-field appearance="outline">
  <mat-label>Search</mat-label>
  <input matInput [(ngModel)]="search" (input)="applyFilter()" placeholder="Username, email, role...">
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div *ngIf="loading" class="loading">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2 full-width" *ngIf="!loading">
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Username</th>
    <td mat-cell *matCellDef="let u">{{ u.username }}</td>
  </ng-container>
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let u">{{ u.email }}</td>
  </ng-container>
  <ng-container matColumnDef="first_name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
    <td mat-cell *matCellDef="let u">{{ u.first_name }}</td>
  </ng-container>
  <ng-container matColumnDef="last_name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
    <td mat-cell *matCellDef="let u">{{ u.last_name }}</td>
  </ng-container>
  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Role</th>
    <td mat-cell *matCellDef="let u">
      <span [class]="'role-badge role-' + u.role">{{ u.role }}</span>
    </td>
  </ng-container>
  <ng-container matColumnDef="is_active">
    <th mat-header-cell *matHeaderCellDef>Active</th>
    <td mat-cell *matCellDef="let u">
      <mat-slide-toggle [checked]="u.is_active" (change)="toggleActive(u)" matTooltip="Toggle active"></mat-slide-toggle>
    </td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let u">
      <button mat-icon-button color="primary" (click)="openEditDialog(u)" matTooltip="Edit">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>
